<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.C.A DE S.V - Muro de Denuncias</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #fafbfc; margin: 0; font-family: 'Montserrat', sans-serif;">

    <!-- Navbar Superior -->
    <header style="background: #ffffff; padding: 16px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo" style="width: 32px; height: 32px;">
            <span style="font-weight: 700; font-size: 16px; color: #000;">D.C.A DE S.V</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- Icono de Notificaciones con enlace activo -->
            <a href="{{ url_for('notificaciones') }}" style="position: relative; cursor: pointer; display: flex; align-items: center; text-decoration: none;">
                <img src="{{ url_for('static', filename='assets/Notificaciones.png') }}" alt="Notificaciones" style="width: 24px; height: 24px;">
                <span style="position: absolute; top: -5px; right: -5px; background: #f98006; color: white; font-size: 9px; padding: 1px 5px; border-radius: 50%; font-weight: bold;">1</span>
            </a>
            <!-- Icono de Perfil con enlace activo -->
            <a href="{{ url_for('perfil') }}" style="cursor: pointer; display: flex; align-items: center; text-decoration: none;">
                <img src="{{ url_for('static', filename='assets/image 11.png') }}" alt="Perfil" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;">
            </a>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main style="max-width: 1300px; margin: 30px auto; padding: 0 40px;">
        
        <!-- Filtros y botón alineados estrictamente a la izquierda -->
        <div style="display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-bottom: 35px; width: 100%;">
            <div style="background: #ffffff; padding: 5px; border-radius: 30px; display: flex; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid #eef0f2;">
                <button style="border: none; background: transparent; color: #666; padding: 8px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;">Todos</button>
                <button style="border: none; background: transparent; color: #666; padding: 8px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;">Recientes</button>
                <button style="border: none; background: #f98006; color: white; padding: 8px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;">En proceso</button>
                <button style="border: none; background: transparent; color: #666; padding: 8px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;">Cerradas</button>
            </div>

            <a href="{{ url_for('denuncia') }}" style="width: 40px; height: 40px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #000; font-size: 22px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #eef0f2;">
                +
            </a>
        </div>

        <!-- Área base vacía -->
        <div style="min-height: 400px; display: flex; align-items: center; justify-content: center; border: 2px dashed #e0e0e0; border-radius: 16px;">
            <p style="color: #888; font-size: 14px; font-weight: 500;">Espacio base listo para el muro de denuncias</p>
        </div>

    </main>

    <script src="{{ url_for('serve_js', filename='main.js') }}"></script>
</body>
</html>
