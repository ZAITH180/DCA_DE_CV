<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.C.A DE S.V - Exito</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo D.C.A DE S.V" class="logo-icon">
            <span class="brand-name">D.C.A DE S.V</span>
        </div>
    </header>

    <main class="main-container">
        <div class="card" style="text-align: center; padding: 50px;">
            <div style="font-size: 48px; color: #f98006; margin-bottom: 20px; font-weight: bold;">✓</div>

            <h1 class="card-title" style="font-size: 20px; margin-bottom: 15px;">¡DENUNCIA ENVIADA CON EXITO!</h1>
            
            <p class="card-subtitle" style="margin-bottom: 30px; font-size: 14px; line-height: 1.5;">
                Su denuncia está en espera a ser revisada por el<br>
                personal de la Alcaldía Municipal de Batres, en<br>
                plazo de 15 días.
            </p>

            <div class="button-group">
                <a href="{{ url_for('muro') }}" 
                   class="btn btn-dark" 
                   style="display: block; text-align: center; text-decoration: none; line-height: normal; width: 200px; margin: 0 auto; padding: 12px; border-radius: 8px;">
                   Aceptar
                </a>
            </div>
        </div>

        <footer class="terms-footer" style="margin-top: 20px;">
            <span class="terms-text" style="text-align: center; display: block; font-size: 12px; color: #666; line-height: 1.4;">
                DevServiceC solo es responsable de enviar<br>
                las denuncias a la alcaldía de Batres, no se<br>
                involucra en la solución de estas.
            </span>
        </footer>
    </main>

    <script src="{{ url_for('serve_js', filename='main.js') }}"></script>
</body>
</html>
