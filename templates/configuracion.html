<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.C.A DE S.V - Configuración</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fafbfc;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Estilos para el Modo Oscuro */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        body.dark-mode header {
            background-color: #1e1e1e !important;
            border-bottom: 1px solid #333 !important;
        }
        body.dark-mode header a {
            color: #ffffff !important;
        }
        body.dark-mode .card-config {
            background-color: #1e1e1e !important;
            border-color: #333 !important;
            color: #ffffff;
        }
        body.dark-mode .text-config {
            color: #e0e0e0 !important;
        }
    </style>

 
</head>
<body>

    <!-- Header con botón de volver -->
    <header style="background: #ffffff; padding: 18px 40px; display: flex; align-items: center; border-bottom: 1px solid #eaeaea; transition: background-color 0.3s;">
        <a href="{{ url_for('perfil') }}" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #000; font-weight: 600; font-size: 14px;">
            <span style="font-size: 18px;">‹</span> Configuración
        </a>
    </header>

    <main style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
        
        <!-- Tarjeta de Modo Oscuro -->
        <div class="card-config" style="background: #ffffff; border: 1px solid #eaeaea; border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02);">
            
            <span class="text-config" style="font-size: 13px; font-weight: 700; color: #333; text-transform: uppercase; letter-spacing: 0.5px;">Modo Oscuro</span>
            
            <!-- Interruptor (Toggle Switch) -->
            <label style="position: relative; display: inline-block; width: 46px; height: 24px; cursor: pointer;">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()" style="opacity: 0; width: 0; height: 0;">
                <span style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 24px;"></span>
                <span id="sliderKnob" style="position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #f98006; transition: .4s; border-radius: 50%;"></span>
            </label>

        </div>

    </main>

    <script>
        // 1. Función para cambiar el modo
        function toggleDarkMode() {
            const isChecked = document.getElementById('darkModeToggle').checked;
            const knob = document.getElementById('sliderKnob');
            const track = knob.previousElementSibling;

            if (isChecked) {
                document.body.classList.add('dark-mode');
                // Mover el círculo a la derecha
                knob.style.transform = "translateX(22px)";
                // Opcional: cambiar color del fondo del interruptor
                track.style.backgroundColor = "#f98006"; 
                knob.style.backgroundColor = "#ffffff";
            } else {
                document.body.classList.remove('dark-mode');
                // Mover el círculo a la izquierda
                knob.style.transform = "translateX(0px)";
                track.style.backgroundColor = "#333";
                knob.style.backgroundColor = "#f98006";
            }
        }

        // 2. Mantener el modo oscuro al recargar la página o cambiar de vista
        document.addEventListener('DOMContentLoaded', () => {
            // Revisamos si el usuario ya había activado el modo oscuro antes
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
                
                // Ajustar el visual del interruptor
                const knob = document.getElementById('sliderKnob');
                const track = knob.previousElementSibling;
                knob.style.transform = "translateX(22px)";
                track.style.backgroundColor = "#f98006";
                knob.style.backgroundColor = "#ffffff";
            }
        });

        // Guardar la preferencia en el navegador al hacer clic
        document.getElementById('darkModeToggle').addEventListener('change', function() {
            if(this.checked) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>

</body>
</html>
