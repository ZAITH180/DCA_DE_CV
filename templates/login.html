<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.C.A DE S.V - Iniciar Sesión</title>
    <!-- Google Fonts & FontAwesome para los íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Encabezado superior -->
    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo D.C.A DE S.V" class="logo-icon">
            <span class="brand-name">D.C.A DE S.V</span>
        </div>
    </header>

    <!-- Contenido principal / Login -->
    <main class="main-container">
        <div class="card card-login">
            <!-- Botón para regresar -->
            <button type="button" class="btn-back" onclick="window.location.href='/'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="card-logo">
                <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo Principal">
            </div>

            <h1 class="card-title">Inicia sesión con tu correo<br>electrónico</h1>
            
            <form action="/login" method="POST" class="login-form">
                <!-- Campo Correo -->
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" required autocomplete="off">
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fa-regular fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón Iniciar sesión -->
                <button type="submit" class="btn btn-orange">Iniciar sesión</button>
            </form>

            <p class="register-text">
                ¿No tienes cuenta? Regístrate <a href="/register" class="register-link">aquí</a>
            </p>
        </div>

        <!-- Footer con Checkbox y Términos -->
        <footer class="terms-footer">
            <label class="checkbox-container">
                <input type="checkbox" id="terms">
                <span class="custom-checkbox"></span>
                <span class="terms-text">
                    Al continuar, aceptas los terminos<br>
                    y condiciones de <a href="#" class="brand-link">DEV’s<span class="orange-text">Service</span>C</a>
                </span>
            </label>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='../js/main.js') }}"></script>
    <script>
        // Lógica para mostrar/ocultar contraseña
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
